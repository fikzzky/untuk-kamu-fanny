<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Fanny ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<div class="container">

    <div class="envelope" id="envelope">

        <div class="heart">❤️</div>

        <h1>Untuk Fanny</h1>

        <p>
            Sebuah surat kecil yang dibuat
            khusus untukmu.
        </p>

        <button id="openBtn">
            💌 Buka Surat
        </button>

    </div>

    <div class="letter" id="letter">

        <h2>Untuk Fanny ❤️</h2>

        <div id="typing"></div>

        <button id="closeBtn">
            🤍 Tutup Surat
        </button>

    </div>

</div>

<div class="flowers"></div>

<script src="script.js"></script>

</body>
</html>
